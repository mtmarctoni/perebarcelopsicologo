minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
allowBuilds:
  sharp: true
  "@biomejs/biome": true
  esbuild: true
  "@swc/core": true
  "@parcel/watcher": true
overrides:
  # 2026-10-25: vite comes only from vitest (a dependency and peer, not
  # declared here), and vitest accepts any vite 8, so `pnpm update` keeps the
  # vulnerable 8.0.16. 8.1.6 fixes GHSA-587h-7wmj-h5pm and four other
  # vite/launch-editor advisories. Dev only. Remove once vitest resolves
  # vite >= 8.1.6 on its own.
  "vite@8": ^8.1.6
  # Within Lighthouse 13.5's supported ^25.9.0 range. Newer Puppeteer releases
  # select a Chromium BiDi prerelease rejected by pnpm's publisher-trust policy.
  # Rechecked 2026-11-08: 25.14.0 still fails ERR_PNPM_TRUST_DOWNGRADE;
  # Lighthouse 13.6 also requires an unavailable tldts-icann version.
  "lighthouse>puppeteer-core": "25.12.0"
